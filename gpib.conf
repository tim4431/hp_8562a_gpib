/* linux-gpib configuration for NI GPIB-USB-HS + HP 8562A spectrum analyzer.
 * Installed to /etc/gpib.conf by setup_gpib.sh. */

interface {
	minor = 0              /* /dev/gpib0 */
	board_type = "ni_usb_b" /* NI GPIB-USB-B / GPIB-USB-HS / HS+ */
	name = "gpib0"
	pad = 0                /* controller primary address */
	sad = 0
	timeout = T10s
	eos = 0x0a
	set-reos = no          /* rely on EOI to end reads (safe for binary trace data) */
	set-bin = no
	set-xeos = no
	set-eot = yes          /* assert EOI with last byte on writes */
	master = yes           /* this PC is system controller */
}

device {
	minor = 0
	name = "hp8562a"
	pad = 18               /* HP 8562A factory default HP-IB address */
	sad = 0
	timeout = T10s
	eos = 0x0a
	set-reos = no
	set-bin = no
}
